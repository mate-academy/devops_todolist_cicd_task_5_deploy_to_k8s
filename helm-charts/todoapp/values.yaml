mysql:
  secrets:
    MYSQL_ROOT_PASSWORD: "xxx"
    MYSQL_USER: "xxx"
    MYSQL_PASSWORD: "xxx"

todoapp:
  namespace: todoapp
  image:
    repository: ikulyk404/todoapp
    tag: "4.0.1"

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"

  secrets:
    SECRET_KEY: zdfsadfsadfsfs
    DB_NAME: app_db
    DB_USER: "xxx"
    DB_PASSWORD: "xxx"
    DB_HOST: "xxx"

  hpa:
    minReplicas: 2
    maxReplicas: 5
    cpu:
      avarageUtilization: 70
    memory:
      avarageUtilization: 70

  volumes:
    persistentVolume:
      capacity: "1Gi"
    persistentVolumeClaim:
      requestStorage: "1Gi"