mysql:
  secrets:
    MYSQL_ROOT_PASSWORD: "change-me-root-password"
    MYSQL_USER: "change-me-user"
    MYSQL_PASSWORD: "change-me-password"

todoapp:
  namespace: todoapp
  image:
    repository: "example/todoapp"
    tag: "latest"

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"

  secrets:
    SECRET_KEY: "change-me-secret-key"
    DB_NAME: "change-me-db-name"
    DB_USER: "change-me-db-user"
    DB_PASSWORD: "change-me-db-password"
    DB_HOST: "change-me-db-host"

  hpa:
    minReplicas: 2
    maxReplicas: 5
    cpu:
      avarageUtilization: 70
    memory:
      avarageUtilization: 70

  volumes:
    persistentVolume:
      capacity: "1Gi"
    persistentVolumeClaim:
      requestStorage: "1Gi"
