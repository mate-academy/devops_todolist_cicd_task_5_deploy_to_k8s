todoapp:
  namespace: todoapp
  image:
    repository: nizartem/todoapp

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"

  volumes:
    persistentVolume:
      capacity: "1Gi"
    persistentVolumeClaim:
      requestStorage: "1Gi"

  common:
   environment: "Staging"
   namespace: mateapp-staging


  mysql:
   namespace: mysql-staging


  todoapp:
   configs:
     APP_ENV: ${{ secrets.DB_USER }}
   secrets:
     password: ${{ secrets.DB_PASSWORD }}


   resources:
     requests:
        memory: "256Mi"
        cpu: "100m"
     limits:
       memory: "256Mi"
       cpu: "100m"
   hpa:
     enabled: true
     minReplicas: 3
     maxReplicas: 5
