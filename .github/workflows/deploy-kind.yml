name: Deploy to Kind Cluster

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: helm-package
        path: .
    - name: Disable swap
      run: sudo swapoff -a


    - name: Set up kind cluster
      uses: helm/kind-action@v1
      with:
        config: ./helm-charts/todoapp/cluster.yml
        wait: 90s

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Helm dry run
      run: |
        helm upgrade --install --dry-run todoapp ./todoapp-*.tgz \
        -f ./helm-charts/todoapp/values.yaml \
        --set todoapp.image.tag=${{ inputs.image_tag }}

    - name: Helm upgrade install atomic
      run: |
        helm upgrade --install --atomic --wait --timeout 180s todoapp ./helm-charts/todoapp-*.tgz \
        -f ./helm-charts/todoapp/values.yaml \
        --set todoapp.image.tag=${{ inputs.image_tag }}

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
