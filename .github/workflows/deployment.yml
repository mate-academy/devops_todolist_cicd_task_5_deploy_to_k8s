name: deployment
on:
    workflow_call:
      inputs:
        environment:
          type: string
          required: true
        tag:
          type: string
          required: true
run-name: Deployment to ${{ inputs.environment }}

jobs:
  helm-cd:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Install and setup Helm
        uses: azure/setup-helm@v5

      - name: Clone repository
        uses: actions/checkout@v7

      - name: Create kind cluser
        run: kind create cluster --config ./cluster.yml

      - name: Helm install dry-run
        run: |
          helm install --dry-run=client --hide-secret \
          todoapp-release \
          ./helm-charts/todoapp

      - name: Helm upgrade
        run: |
          helm upgrade --install --atomic --timeout 5m --debug \
          todoapp-${{ inputs.environment }} ./helm-charts/todoapp \
          --set mysql.secrets.MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
          --set mysql.secrets.MYSQL_USER="${{ secrets.MYSQL_USER }}" \
          --set mysql.secrets.MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
          --set todoapp.secrets.DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
          --set todoapp.secrets.DB_USER="${{ secrets.DB_USER }}" \
          --set todoapp.secrets.DB_HOST="${{ secrets.DB_HOST }}" \
          --set todoapp.image.repository="${{ vars.DOCKERHUB_USERNAME }}/todoapp" \
          --set todoapp.image.tag="${{ inputs.tag }}"

      - name: Check deployment
        run: kubectl get ns
