name: Reusable kind deployment

on:
  workflow_call:
    inputs:
      environment_name:
        description: GitHub environment to deploy to
        required: true
        type: string
      image_tag:
        description: Docker image tag
        required: true
        type: string
      values_file:
        description: Helm values file
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}

    env:
      RELEASE_NAME: todoapp
      CHART_PATH: ./helm-charts/todoapp
      VALUES_FILE: ${{ inputs.values_file }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

    steps:
      - name: Download deployment artifacts
        uses: actions/download-artifact@v8
        with:
          name: deployment-artifacts
          path: .

      - name: Validate environment configuration
        shell: bash
        run: |
          required_variables=(
            IMAGE_REPOSITORY
            IMAGE_TAG
            DJANGO_SECRET_KEY
            DB_NAME
            DB_USER
            DB_PASSWORD
            MYSQL_ROOT_PASSWORD
          )

          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::${variable_name} is not configured"
              exit 1
            fi
          done

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.1

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: kind-${{ inputs.environment_name }}
          config: ./cluster.yml
          wait: 120s

      - name: Helm install dry run
        shell: bash
        run: |
          helm install --dry-run --hide-secret \
            "$RELEASE_NAME" "$CHART_PATH" \
            --namespace todoapp \
            --values "$VALUES_FILE" \
            --set-string todoapp.image.repository="$IMAGE_REPOSITORY" \
            --set-string todoapp.image.tag="$IMAGE_TAG" \
            --set-string todoapp.secrets.SECRET_KEY="$DJANGO_SECRET_KEY" \
            --set-string todoapp.secrets.DB_NAME="$DB_NAME" \
            --set-string todoapp.secrets.DB_USER="$DB_USER" \
            --set-string todoapp.secrets.DB_PASSWORD="$DB_PASSWORD" \
            --set-string mysql.secrets.MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --set-string mysql.secrets.MYSQL_USER="$DB_USER" \
            --set-string mysql.secrets.MYSQL_PASSWORD="$DB_PASSWORD"

      - name: Deploy with Helm
        shell: bash
        run: |
          helm upgrade --install \
            "$RELEASE_NAME" "$CHART_PATH" \
            --namespace todoapp \
            --values "$VALUES_FILE" \
            --set-string todoapp.image.repository="$IMAGE_REPOSITORY" \
            --set-string todoapp.image.tag="$IMAGE_TAG" \
            --set-string todoapp.secrets.SECRET_KEY="$DJANGO_SECRET_KEY" \
            --set-string todoapp.secrets.DB_NAME="$DB_NAME" \
            --set-string todoapp.secrets.DB_USER="$DB_USER" \
            --set-string todoapp.secrets.DB_PASSWORD="$DB_PASSWORD" \
            --set-string mysql.secrets.MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --set-string mysql.secrets.MYSQL_USER="$DB_USER" \
            --set-string mysql.secrets.MYSQL_PASSWORD="$DB_PASSWORD" \
            --atomic \
            --cleanup-on-fail \
            --timeout 10m

      - name: Verify deployment
        run: |
          helm status "$RELEASE_NAME" --namespace todoapp
          kubectl get pods --all-namespaces