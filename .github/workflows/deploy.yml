name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kind
        uses: helm/kind-action@v1.10.0
        with:
          config: cluster.yml
          cluster_name: kind

      - name: Set Up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Dry Run Helm
        run: |
          helm install todoapp ./helm-charts/todoapp \
            -f ./helm-charts/todoapp/values.yaml \
            --dry-run \
            --set todoapp.image.tag=${{ inputs.version }} \
            --set todoapp.secrets.SECRET_KEY=${{ secrets.SECRET_KEY }} \
            --set todoapp.secrets.DB_NAME=${{ secrets.DB_NAME }} \
            --set todoapp.secrets.DB_USER=${{ secrets.DB_USER }} \
            --set todoapp.secrets.DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --set todoapp.secrets.DB_HOST=${{ secrets.DB_HOST }} \
            --set mysql.secrets.MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
            --set mysql.secrets.MYSQL_USER=${{ secrets.MYSQL_USER }} \
            --set mysql.secrets.MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
      - name: Deploy Helm
        run: |
          helm upgrade --install todoapp ./helm-charts/todoapp \
            -f ./helm-charts/todoapp/values.yaml \
            --timeout 10m \
            --debug \
            --set todoapp.image.tag=${{ inputs.version }} \
            --set todoapp.secrets.SECRET_KEY=${{ secrets.SECRET_KEY }} \
            --set todoapp.secrets.DB_NAME=${{ secrets.DB_NAME }} \
            --set todoapp.secrets.DB_USER=${{ secrets.DB_USER }} \
            --set todoapp.secrets.DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --set todoapp.secrets.DB_HOST=${{ secrets.DB_HOST }} \
            --set mysql.secrets.MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
            --set mysql.secrets.MYSQL_USER=${{ secrets.MYSQL_USER }} \
            --set mysql.secrets.MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}

      - name: Node resource usage
        if: always()
        run: |
          echo "--- Node capacity/allocatable ---"
          kubectl describe nodes | grep -A 5 "Capacity:\|Allocatable:"
          echo "--- Node resource usage (metrics) ---"
          kubectl top nodes 2>&1 || echo "metrics-server not available"
          echo "--- Pod resource usage (metrics) ---"
          kubectl top pods -A 2>&1 || echo "metrics-server not available"

      - name: Wait for rollout
        if: always()
        run: |
          echo "--- Waiting for mysql StatefulSet ---"
          kubectl rollout status statefulset/mysql -n mysql --timeout=120s || true
          echo "--- Waiting for todoapp Deployment ---"
          kubectl rollout status deployment/todoapp-todoapp -n todoapp --timeout=120s || true

      - name: Debug pods
        if: always()
        run: |
          echo "--- Pods (all namespaces) ---"
          kubectl get pods -A -o wide
          echo "--- Events (todoapp namespace) ---"
          kubectl get events -n todoapp --sort-by='.lastTimestamp' || true
          echo "--- Events (mysql namespace) ---"
          kubectl get events -n mysql --sort-by='.lastTimestamp' || true
          echo "--- todoapp pod describe ---"
          kubectl describe pod -l app=todoapp -n todoapp || true
          echo "--- todoapp pod logs ---"
          kubectl logs -l app=todoapp -n todoapp --tail=200 --all-containers || true
          echo "--- todoapp previous pod logs (if crashed/restarted) ---"
          kubectl logs -l app=todoapp -n todoapp --tail=200 --all-containers --previous || true
          echo "--- mysql pod describe ---"
          kubectl describe pod -l app=mysql -n mysql || true
          echo "--- mysql pod logs ---"
          kubectl logs -l app=mysql -n mysql --tail=200 --all-containers || true