name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target deployment environment (development, staging)"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Create KinD cluster
        uses: engineerd/setup-kind@v0.5.0
        with:
          config: ./cluster.yml

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get pods

      - name: Helm install (Dry Run)
        run: |
          helm install my-app ./charts --dry-run --debug

      - name: Helm Upgrade
        run: |
          helm upgrade --install my-app ./charts \
            --atomic \
            --timeout 5m0s