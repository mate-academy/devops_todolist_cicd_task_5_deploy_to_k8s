name: Create Kind Cluster and Deploy Helm Chart
run-name: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_number }}

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      kind-artifacts:
        type: string
        default: "kind-artifacts"
      helm-package:
        type: string
        default: "helm-package"
      helm-artifacts:
        type: string
        default: "helm-artifacts"
      helm-values-path:
        type: string
        default: "./todoapp/values.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: ${{ inputs.environment }}
    environment: ${{ inputs.environment }}

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.kind-artifacts }}
        path: .

    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.helm-package }}
        path: .

    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.helm-artifacts }}
        path: .


    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1
      with:
        config: ./cluster.yml

    - name: Set up Helm
      uses: azure/setup-helm@v4.2.0

    - uses: azure/setup-kubectl@v4
      name: Set up Kubectl

    - name: Testing Helm
      run: |
        helm install --dry-run --hide-secret --debug todoapp ./todoapp-*.tgz  \
          -f "${{ inputs.helm-values-path }}" \
          --set mysql.secrets.MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
          --set mysql.secrets.MYSQL_USER=${{ secrets.MYSQL_USER }} \
          --set mysql.secrets.MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
          --set todoapp.secrets.SECRET_KEY=${{ secrets.SECRET_KEY }} \
          --set todoapp.secrets.DB_NAME=${{ secrets.DB_NAME }} \
          --set todoapp.secrets.DB_USER=${{ secrets.MYSQL_USER }} \
          --set todoapp.secrets.DB_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
          --set todoapp.secrets.DB_HOST=${{ secrets.DB_HOST }}


    - name: Deploy Helm
      run: |
        helm upgrade --install --atomic  --wait --timeout 1800s --debug todoapp ./todoapp-*.tgz  \
          -f "${{ inputs.helm-values-path }}" \
          --set mysql.secrets.MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
          --set mysql.secrets.MYSQL_USER=${{ secrets.MYSQL_USER }} \
          --set mysql.secrets.MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
          --set todoapp.secrets.SECRET_KEY=${{ secrets.SECRET_KEY }} \
          --set todoapp.secrets.DB_NAME=${{ secrets.DB_NAME }} \
          --set todoapp.secrets.DB_USER=${{ secrets.MYSQL_USER }} \
          --set todoapp.secrets.DB_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
          --set todoapp.secrets.DB_HOST=${{ secrets.DB_HOST }}