name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Helm Artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-package

      - name: Install Kind
        uses: helm/kind-action@v1.12.0
        with:
          install_only: true

      - name: Create Kind Cluster
        run: kind create cluster --config cluster.yml

      - name: Helm Dry Run
        run: helm install todoapp ./todoapp-0.1.0.tgz --dry-run

      - name: Helm Deployment
        run: helm upgrade --install todoapp ./todoapp-0.1.0.tgz --atomic