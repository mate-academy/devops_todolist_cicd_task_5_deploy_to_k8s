name: Deploy to kind

on:
  workflow_call:
    inputs:
      environment:
        description: "Name of the GitHub Environment / values overlay to deploy (e.g. development, staging)"
        required: true
        type: string
      docker-image-name:
        description: "DockerHub image repository name (without the username) to deploy"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: cluster.yml

      - name: Helm install (dry run)
        run: |
          helm install todoapp ./helm-charts/todoapp \
            -f ./helm-charts/todoapp/values.yaml \
            -f ./helm-charts/todoapp/values/${{ inputs.environment }}.yaml \
            --namespace todoapp \
            --create-namespace \
            --set todoapp.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.docker-image-name }} \
            --set todoapp.image.tag=${{ github.sha }} \
            --set todoapp.secrets.SECRET_KEY=${{ secrets.SECRET_KEY }} \
            --set todoapp.secrets.DB_NAME=${{ secrets.DB_NAME }} \
            --set todoapp.secrets.DB_USER=${{ secrets.DB_USER }} \
            --set todoapp.secrets.DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --set todoapp.secrets.DB_HOST=${{ secrets.DB_HOST }} \
            --set mysql.secrets.MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
            --set mysql.secrets.MYSQL_USER=${{ secrets.MYSQL_USER }} \
            --set mysql.secrets.MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
            --dry-run

      - name: Helm upgrade --install (atomic)
        run: |
          helm upgrade --install todoapp ./helm-charts/todoapp \
            -f ./helm-charts/todoapp/values.yaml \
            -f ./helm-charts/todoapp/values/${{ inputs.environment }}.yaml \
            --namespace todoapp \
            --create-namespace \
            --set todoapp.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.docker-image-name }} \
            --set todoapp.image.tag=${{ github.sha }} \
            --set todoapp.secrets.SECRET_KEY=${{ secrets.SECRET_KEY }} \
            --set todoapp.secrets.DB_NAME=${{ secrets.DB_NAME }} \
            --set todoapp.secrets.DB_USER=${{ secrets.DB_USER }} \
            --set todoapp.secrets.DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --set todoapp.secrets.DB_HOST=${{ secrets.DB_HOST }} \
            --set mysql.secrets.MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
            --set mysql.secrets.MYSQL_USER=${{ secrets.MYSQL_USER }} \
            --set mysql.secrets.MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
            --atomic \
            --timeout 5m
