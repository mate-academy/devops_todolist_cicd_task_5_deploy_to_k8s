name: Deploy to Kind

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download helm artifacts
        uses: actions/download-artifact@v4
        with:
          name: helm-artifacts
          path: .

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: ./cluster.yml

      - name: Helm dry-run
        run: |
          helm install todoapp ./todoapp \
            -f ./todoapp/values.yaml \
            --dry-run --debug \
            --namespace ${{ inputs.environment }} \
            --create-namespace

      - name: Helm upgrade --install (atomic)
        run: |
          helm upgrade --install todoapp ./todoapp \
            -f ./todoapp/values.yaml \
            --namespace ${{ inputs.environment }} \
            --create-namespace \
            --atomic \
            --timeout 5m