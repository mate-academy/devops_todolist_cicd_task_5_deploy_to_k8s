name: CI/CD

on:
  workflow_dispatch:

jobs:
  build_push:
    uses: ./.github/workflows/build_push.yml
    secrets: inherit

  deploy_dev:
    needs: build_push
    uses: ./.github/workflows/deploy_kind.yml
    secrets: inherit
    with:
      environment: development
      image_repo: ${{ needs.build_push.outputs.image_repo }}
      image_tag: ${{ needs.build_push.outputs.image_tag }}

  deploy_staging:
    needs: deploy_dev
    uses: ./.github/workflows/deploy_kind.yml
    secrets: inherit
    with:
      environment: staging
      image_repo: ${{ needs.build_push.outputs.image_repo }}
      image_tag: ${{ needs.build_push.outputs.image_tag }}
