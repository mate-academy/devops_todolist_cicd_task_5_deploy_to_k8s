name: helm-upgrade
run-name: ${{ github.actor }}-${{ github.sha }}

on:
    workflow_call:
        inputs:
            environment:
                required: true
                type: string
            version:
                required: true
                type: string
            helm_values_path:
                type: string
                default: "./helm-charts/todoapp/values.yaml"
            helm-release-name:
                type: string
                default: "todoapp"

jobs:
    deploy-helm:
        name: ${{ inputs.environment }}
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}

        steps:
            - uses: actions/checkout@v4

            - name: Set up Kubectl
              uses: azure/setup-kubectl@v4

            - name: Create k8s Kind Cluster
              uses: helm/kind-action@v1
              with:
                config: ${{ github.workspace }}/cluster.yml

            - uses: actions/download-artifact@v4
              with:
                  name: helm-package
                  path: .

            - name: Set up helm
              uses: azure/setup-helm@v4.2.0

            - name: Helm dry run
              run: |
                helm install ${{ inputs.helm-release-name }} ${{ github.workspace }}/*.tgz --dry-run \
                -f ${{ inputs.helm_values_path }} \
                --set mysql.secrets.MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
                --set mysql.secrets.MYSQL_USER=${{ secrets.MYSQL_USER }} \
                --set mysql.secrets.MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
                --set todoapp.secrets.SECRET_KEY=${{ secrets.SECRET_KEY }} \
                --set todoapp.secrets.DB_NAME=${{ secrets.DB_NAME }} \
                --set todoapp.secrets.DB_USER=${{ secrets.DB_USER }} \
                --set todoapp.secrets.DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                --set todoapp.secrets.DB_HOST=${{ secrets.DB_HOST }} \
                --set todoapp.image.tag=${{ inputs.version }}

            - name: Helm upgrade
              run: |
                helm upgrade --install --atomic --wait --debug --timeout 10m ${{ inputs.helm-release-name }} ${{ github.workspace }}/*.tgz \
                -f ${{ inputs.helm_values_path }} \
                --set mysql.secrets.MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
                --set mysql.secrets.MYSQL_USER=${{ secrets.MYSQL_USER }} \
                --set mysql.secrets.MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
                --set todoapp.secrets.SECRET_KEY=${{ secrets.SECRET_KEY }} \
                --set todoapp.secrets.DB_NAME=${{ secrets.DB_NAME }} \
                --set todoapp.secrets.DB_USER=${{ secrets.DB_USER }} \
                --set todoapp.secrets.DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                --set todoapp.secrets.DB_HOST=${{ secrets.DB_HOST }} \
                --set todoapp.image.tag=${{ inputs.version }}

