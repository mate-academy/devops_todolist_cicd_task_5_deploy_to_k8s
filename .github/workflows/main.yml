name: python-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  PythonVersion: 3.8
  DockerImageName: chornoknysh/todoapp

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PythonVersion }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt
        working-directory: ./todoapp

      - name: Run tests
        run: python manage.py test
        working-directory: ./todoapp

      - name: Coverage report
        run: |
          coverage run --source='.' manage.py test
          coverage report
        working-directory: ./todoapp

      - name: Linting
        run: flake8 . --show-source --statistics --exit-zero
        working-directory: ./todoapp

      - name: Check complexity
        run: flake8 . --exit-zero --max-complexity=6
        working-directory: ./todoapp

  docker-ci:
    runs-on: ubuntu-latest
    needs: python-ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./todoapp
          file: ./todoapp/Dockerfile
          push: true
          tags: |
            ${{ env.DockerImageName }}:${{ github.sha }}
            ${{ env.DockerImageName }}:latest

  deploy-dev:
    needs: docker-ci
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: dev
      cluster_name: todo-dev
      namespace: todo-dev
      chart_path: ./helm-charts
      release_name: todo-dev
      image: ${{ env.DockerImageName }}
      image_tag: ${{ github.sha }}
    secrets: inherit

  deploy-staging:
    needs: docker-ci
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: staging
      cluster_name: todo-staging
      namespace: todo-staging
      chart_path: ./helm-charts
      release_name: todo-staging
      image: ${{ env.DockerImageName }}
      image_tag: ${{ github.sha }}
    secrets: inherit
