name: Django CI

run-name: Run by ${{ github.actor }} on commit ${{ github.sha }}

on:
  push:
    branches:
      - d4vp4
  pull_request:
    branches:
      - d4vp4

env:
  PYTHON_VERSION: '3.10'
  DOCKER_IMAGE_NAME: 'd4vp4/todo-app'

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install coverage flake8

      - name: Run Tests and Generate Coverage
        run: |
          cd src
          coverage run manage.py test
          coverage report

      - name: Check Code Style
        continue-on-error: true
        run: flake8 src

      - name: Check Complexity
        continue-on-error: true
        run: flake8 src --max-complexity=10 --exit-zero

      - name: Upload Codebase
        uses: actions/upload-artifact@v4
        with:
          name: codebase
          path: .
          include-hidden-files: true

  docker-ci:
    runs-on: ubuntu-latest
    needs: python-ci
    if: github.ref == 'refs/heads/d4vp4'

    environment: development

    steps:
      - name: Download Codebase
        uses: actions/download-artifact@v4
        with:
          name: codebase
          path: .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }},${{ env.DOCKER_IMAGE_NAME }}:latest

  helm-ci:
    runs-on: ubuntu-latest
    needs: python-ci
    if: github.ref == 'refs/heads/d4vp4'

    steps:
      - name: Download Codebase
        uses: actions/download-artifact@v4
        with:
          name: codebase
          path: .

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Helm Template
        run: helm template ./helm-charts/todoapp

      - name: Helm Lint
        run: helm lint ./helm-charts/todoapp

      - name: Helm Package
        run: helm package ./helm-charts/todoapp

      - name: Upload Helm Chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-package
          path: "*.tgz"

  deploy-development:
    needs: [docker-ci, helm-ci]
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: development
      image_tag: ${{ github.sha }}
      docker_image_name: ${{ env.DOCKER_IMAGE_NAME }}

  deploy-staging:
    needs: deploy-development
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: staging
      image_tag: ${{ github.sha }}
      docker_image_name: ${{ env.DOCKER_IMAGE_NAME }}