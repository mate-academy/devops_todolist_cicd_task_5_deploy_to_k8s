name: helm-upgrade
run-name: ${{ github.actor }} - ${{ github.ref_name}}

on:
  workflow_call:
    inputs:
      environment:
        required: true
        description: 'The environment to deploy'
        type: string
      version:
        required: true
        description: 'The version of the helm chart to deploy'
        type: string
      helm-values-path:
        type: string
        default: './helm-charts/todoapp/values.yaml'
      helm-release-name:
        type: string
        default: 'todoapp'
jobs:
  deploy-helm:
        name: ${{ inputs.environment }}
        runs-on: ubuntu-24.04
        environment: ${{ inputs.environment }}

        steps:
        - uses: actions/download-artifact@v4
          with:
            name: helm-package
            path: .
        
        - uses: actions/download-artifact@v4
          with:
            name: helm-artifacts
            path: .
        
        - name: Set Up Helm
          uses: azure/setup-helm@v4.2.0

        - name: Set up Kubectl
          uses: azure/setup-kubectl@v4

        - name: Create Kind Cluster
          uses: helm/kind-action@v1
          with:
            config: cluster.yml
            cluster_name: ${{ inputs.environment }}

        
        - name: Helm Dry Run
          run: |
            helm install "${{ inputs.helm-release-name }}" \
              ./helm-charts/todoapp \
              --namespace todoapp \
              --create-namespace \
              --dry-run \
              -f "${{ inputs.helm-values-path }}"
        
        
        - name: Deploy Helm Chart
          shell: bash
          run: |
            helm upgrade --install \
              "${{ inputs.helm-release-name }}" \
              ./helm-charts/todoapp \
              -f "${{ inputs.helm-values-path }}" \
              --atomic \
              --wait \
              --timeout 10m \
              --set mysql.config.MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
              --set mysql.config.MYSQL_USER="${{ secrets.MYSQL_USER }}" \
              --set mysql.config.MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
              --set todoapp.secrets.SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              --set todoapp.secrets.DB_NAME="${{ secrets.DB_NAME }}" \
              --set todoapp.secrets.DB_USER="${{ secrets.DB_USER }}" \
              --set todoapp.secrets.DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              --set todoapp.secrets.DB_HOST="${{ secrets.DB_HOST }}" \
              --set-string todoapp.image.repository="${{ secrets.DOCKERHUB_USERNAME }}/todoapp" \
              --set-string todoapp.image.tag="${{ inputs.version }}"
