name: helm-upgrade
run-name: ${{github.actor}} - ${{ github. ref_name }}

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        description: 'The environment to deploy to'
      version:
        required: true
        type: string
      helm-values-path:
        type: string
        default: './todoapp/values.yaml'
      helm-release-name:
        default: todoapp
        type: string


jobs:
    deploy-helm:
      runs-on: ubuntu-latest
      environment: ${{inputs.environment}}
      name: ${{inputs.environment}}

      steps:
        - uses: actions/download-artifact@v4
          with:
            name: helm-package
            path: .

        - uses: actions/download-artifact@v4
          with:
            name: helm-artifacts
            path: .

        - name: Set up Helm
          uses: azure/setup-helm@v4.2.0


        - name: Set up Kubectl
          uses: azure/setup-kubectl@v4.2.0

        - uses: azure/login@v2
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}

        - uses: azure/aks-set-context@v3
          with:
            cluster-name: ${{ vars.AZURE_CLUSTER_NAME }}
            resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}

        - name: Deploy Helm to Development
          run: |
            helm upgrade --install --atomic  --wait --timeout 3600s --debug ${{ inputs.helm-release-name }} ./todoapp-*.tgz \
            -f ${{ inputs.helm-values-path }} \
            --set mysql.configs.MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --set mysql.configs.MYSQL_USER="${{ secrets.MYSQL_USER }}" \
            --set mysql.configs.MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --set todoapp.secrets.password="${{ secrets.PASSWORD }}" \
            --set todoapp.secrets.login="${{ secrets.LOGIN }}" \
            --set todoapp.secrets.DB_CONNECTION="${{ secrets.DB_CONNECTION }}" \
            --set global.environment="${{ inputs.environment }}" \
            --set todoapp.image.version="${{ github.sha }}"
    
