name: helm-upgrade
run-name: ${{ github.actor }} - ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      environment:
        required: true
        description: 'Environment to deploy'
        type: string

      version:
        type: string

      helm-values-path:
        type: string
        default: './todoapp/values.yaml'

      helm-release-name:
        type: string
        default: todoapp

jobs:
  deploy-helm:
    name: ${{ inputs.environment  }}
    needs: [docker-ci, helm-ci]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment  }}

    steps:
      - name: Download Helm Package
        uses: actions/download-artifact@v4
        with:
          name: helm-package
          path: .

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1
        with:
          config: cluster.yml

      - name: Helm Dry Run
        run: |
          helm install --dry-run --debug ${{ inputs.helm-release-name }} ./todoapp \
            -f ${{ inputs.helm-values-path }} \
            --set mysql.configs.MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --set mysql.configs.MYSQL_USER="${{ secrets.MYSQL_USER }}" \
            --set mysql.configs.MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --set kube2py.secrets.password="${{ secrets.TODOAPP_PASSWORD }}" \
            --set kube2py.secrets.login="${{ secrets.TODOAPP_LOGIN }}" \
            --set kube2py.secrets.DB_CONNECTION="${{ secrets.DB_CONNECTION }}" \
            --set todoapp.image.version=${{ github.sha }}

      - name: Deploy Helm
        run: |
          helm upgrade --install --atomic --wait --timeout 3600s ${{ inputs.helm-release-name }} ./todoapp \
            -f ${{ inputs.helm-values-path }} \
            --set mysql.configs.MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --set mysql.configs.MYSQL_USER="${{ secrets.MYSQL_USER }}" \
            --set mysql.configs.MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --set kube2py.secrets.password="${{ secrets.TODOAPP_PASSWORD }}" \
            --set kube2py.secrets.login="${{ secrets.TODOAPP_LOGIN }}" \
            --set kube2py.secrets.DB_CONNECTION="${{ secrets.DB_CONNECTION }}" \
            --set todoapp.image.version=${{ github.sha }}